# Configuracao do Ruff (linter/formatter) para o backend do FireWatch.
# Uso: python -m ruff check .        (auditoria)
#      python -m ruff check . --fix  (aplica correcoes seguras)

line-length = 100
target-version = "py311"
exclude = [".venv", "__pycache__"]

[lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RET", "RUF"]
ignore = [
    "E501", # comprimento de linha: tratado pela formatacao, nao pelo linter
    "B008", # FastAPI exige Depends(...) como valor padrao do argumento
    "RUF100", # nao validar diretivas `# noqa` referentes a regras nao selecionadas
]

[lint.per-file-ignores]
"tests/*" = ["E402"] # os testes ajustam o sys.path antes de importar
